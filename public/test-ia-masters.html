<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quel animal sauvage est ton entreprise ? — Collectif Sauvage</title>
<meta name="description" content="Passe le test en 2 min, découvre ton animal et reçois ton bilan offert. Objectif : devenir un Lion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  VERSION DE TEST — DA du site collectifsauvage.com (design system v1, nov. 2026)
  Reprend la mécanique et les animations de la V1 de Nico (sauvage.developpement-web-ia.com),
  avec les 11 questions fusionnées (marque / visibilité / organisation / binôme humain + IA).
  Pas de back-end ici : à la fin du test, le payload est loggé en console (voir submitResults()).
-->
<style>
:root{
  --ink:#171D3A; --pink:#F598FF; --peri:#94ABF9; --white:#FFFFFF; --black:#000;
  --pink-soft:#FCE3FF;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.16);
  --card:#FFFFFF; --card-ink:#171D3A; --card-muted:rgba(23,29,58,.55);
  --danger:#FF7A8A;
  --shadow:0 30px 60px -25px rgba(0,0,0,.65);
  --display:"Anton",Impact,sans-serif; --body:"Epilogue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--white);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.display,h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.005em;line-height:.95}
.accent{color:var(--pink)}
.peri{color:var(--peri)}

/* ---------- composants ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;
  background:var(--peri);color:var(--ink);font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;
  padding:.35rem 1.1rem;font-size:1rem}
.pill.pink{background:var(--pink)}
.pill.outline{background:transparent;color:var(--white);border:1px solid var(--line)}
/* Boutons : contour au repos, plein au survol (règle du design system) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:56px;padding:.8rem 2rem;
  border-radius:999px;border:1.5px solid var(--white);color:var(--white);font-family:var(--body);font-weight:600;
  font-size:1.05rem;transition:background .2s,color .2s,transform .2s,border-color .2s}
.btn:hover{background:var(--white);color:var(--pink)}
.btn:active{transform:scale(.97)}
.btn.pink{border-color:var(--pink);color:var(--pink)}
.btn.pink:hover{background:var(--pink);color:var(--ink)}
.btn.peri{border-color:var(--peri);color:var(--peri)}
.btn.peri:hover{background:var(--peri);color:var(--ink)}
.btn.big{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;font-weight:400;font-size:1.6rem;padding:.8rem 2.4rem}
.pulse{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,152,255,.45)}50%{box-shadow:0 0 0 16px rgba(245,152,255,0)}}
.star{animation:spin 14s linear infinite;color:var(--white)}
@keyframes spin{to{transform:rotate(360deg)}}
.ellipse{position:absolute;pointer-events:none;color:var(--peri);z-index:-1}
/* boucle tissée : la partie haute passe derrière le mot, la partie basse devant */
.ellipse.front{z-index:1;clip-path:inset(56% 0 0 0)}
.animal-name,.word.lion{isolation:isolate}
.ellipse path{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card{background:var(--card);color:var(--card-ink);border-radius:1.5rem;box-shadow:var(--shadow)}
.kicker{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--card-muted)}

/* marquee façon site */
.marquee{overflow:hidden;white-space:nowrap;background:var(--peri);color:var(--ink);font-family:var(--display);text-transform:uppercase;
  font-size:1rem;padding:.45rem 0;letter-spacing:.02em}
.marquee span{display:inline-block;animation:marq 22s linear infinite;padding-left:100%}
@keyframes marq{to{transform:translateX(-100%)}}

/* ---------- écrans ---------- */
main{position:relative;min-height:100dvh}
.screen{animation:screenIn .3s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.screen.out{animation:screenOut .3s ease both}
@keyframes screenOut{to{opacity:0;transform:translateY(-20px)}}

/* cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100dvh - 34px);padding:2rem 1.25rem 2.5rem}
.brand{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.9rem,6vw,3rem)}
.cover h1{margin-top:1.5rem;max-width:56rem;font-size:clamp(2.6rem,11vw,6.5rem)}
.emoji{display:inline-block}
.pop{animation:pop .55s cubic-bezier(.34,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.ticker{position:relative;margin:1rem auto 0;height:1.1em;font-size:clamp(3.5rem,16vw,8rem);line-height:1;display:flex;justify-content:center;align-items:center;perspective:600px;width:100%}
.ticker .word{position:absolute;font-family:var(--display);text-transform:uppercase;color:var(--pink);display:inline-block}
.word.in{animation:wIn .35s ease both}
.word.out{animation:wOut .35s ease both}
.word.lion{animation:wIn .35s ease both, lion .8s ease .1s both}
@keyframes wIn{from{transform:translateY(-100%) rotateX(80deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wOut{to{transform:translateY(100%) rotateX(-80deg);opacity:0}}
@keyframes lion{0%{scale:1}25%{scale:1.25}50%{scale:.95}75%{scale:1.05}100%{scale:1}}
.spark{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;color:var(--peri)}

.stack{position:relative;margin:2rem auto 0;width:16rem;height:11rem}
@media(min-width:640px){.stack{width:18rem;height:12rem}}
.stack .card{position:absolute;inset:0;padding:1.25rem;text-align:left;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .5s}
.stack .q{font-family:var(--display);text-transform:uppercase;font-size:1.5rem;line-height:1.05;margin-top:.25rem}
.stack .opts{margin-top:.75rem;display:flex;justify-content:space-between;gap:.5rem;font-size:.72rem;font-weight:700}
.stack .opts span{border-radius:999px;padding:.25rem .75rem;border:2px solid var(--ink)}
.stack .opts span:last-child{background:var(--ink);color:var(--white)}

.qr{position:fixed;right:1.5rem;bottom:1.5rem;display:none;flex-direction:column;align-items:center;gap:.5rem;padding:1rem}
.qr p{font-family:var(--display);text-transform:uppercase;font-size:.9rem}
@media(min-width:768px){.qr{display:flex}}
footer.sig{margin-top:1.5rem}
footer.sig .t{font-family:var(--display);text-transform:uppercase;font-size:1.25rem}
footer.sig .s{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.small{font-size:.9rem;font-weight:600;color:var(--muted)}

/* identité */
.form-wrap{max-width:32rem;margin:0 auto;padding:2.5rem 1.25rem}
.form-wrap h2{font-size:clamp(3rem,12vw,3.75rem)}
form{margin-top:1.5rem;display:flex;flex-direction:column;gap:1rem}
label.f{display:flex;flex-direction:column;gap:.35rem}
label.f span.l{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=email],input[type=tel],input[type=url]{height:56px;border-radius:999px;border:1.5px solid var(--peri);
  background:rgba(148,171,249,.08);color:var(--white);padding:0 1.25rem;font:inherit;font-size:1.05rem;outline:none;transition:border-color .2s,background .2s}
input::placeholder{color:rgba(255,255,255,.35)}
input:focus{border-color:var(--pink);background:rgba(245,152,255,.08)}
input[aria-invalid=true]{border-color:var(--danger)}
.err{font-size:.85rem;font-weight:600;color:var(--danger)}
.rgpd{display:flex;gap:.75rem;align-items:flex-start;padding:1rem;border-radius:1.25rem;border:1px solid var(--line);cursor:pointer;font-size:.88rem;font-weight:600;margin-top:.5rem}
.rgpd input{width:22px;height:22px;flex-shrink:0;accent-color:var(--pink);margin-top:2px}

/* quiz */
.quiz{max-width:28rem;margin:0 auto;padding:1.5rem 1.25rem 9.5rem;min-height:100dvh;display:flex;flex-direction:column}
.progress{display:flex;align-items:center;gap:.75rem}
.bar{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--pink);transition:width .4s ease}
.badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);background:var(--white);box-shadow:var(--shadow)}
.badge.bump{animation:bump .4s ease}
@keyframes bump{from{transform:scale(.4)}to{transform:scale(1)}}
.badge-name{margin-top:.5rem;text-align:right;font-family:var(--display);text-transform:uppercase;font-size:.9rem;color:var(--pink)}
.arena{position:relative;margin-top:1rem;height:min(60vh,460px);width:100%}
.swipe{position:absolute;inset:0;display:flex;flex-direction:column;padding:1.5rem;border-radius:2rem;touch-action:none;cursor:grab;user-select:none;
  animation:cardIn .35s ease both}
.swipe:active{cursor:grabbing}
@keyframes cardIn{from{transform:translateY(20px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.swipe{padding:2rem}}
.swipe .sec{display:inline-block;margin-top:.6rem;align-self:flex-start;border-radius:999px;background:var(--pink-soft);color:var(--ink);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .7rem}
.swipe .sec.bonus{background:var(--peri)}
.swipe .qq{font-family:var(--display);text-transform:uppercase;margin-top:.9rem;font-size:clamp(2.2rem,9vw,3.4rem);line-height:.95}
.answers{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:.75rem;font-size:.9rem;font-weight:700}
.answers button{font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:2px solid transparent;border-radius:1rem;padding:.9rem 1rem;min-height:64px;line-height:1.2;transition:transform .15s,border-color .15s,box-shadow .15s}
.answers button[data-c="A"]{background:var(--peri)}
.answers button[data-c="B"]{background:var(--pink);text-align:right}
.answers button:hover,.answers button:focus-visible{border-color:var(--ink);outline:none}
.answers button:active{transform:scale(.97)}
.answers button.on{transform:scale(1.05);border-color:var(--ink);box-shadow:0 6px 18px rgba(23,29,58,.25)}
.stamp{position:absolute;left:50%;top:50%;pointer-events:none;font-family:var(--display);text-transform:uppercase;font-size:1.5rem;color:var(--ink);
  background:var(--pink);border:4px solid var(--ink);border-radius:.75rem;padding:.5rem 1rem;text-align:center;max-width:80%;
  translate:-50% -50%;animation:stamp .3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(var(--r))}to{opacity:1;transform:scale(1) rotate(0)}}

/* résultat */
.result{max-width:36rem;margin:0 auto;padding:2.5rem 1.25rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.big-animal{margin-top:1.5rem;color:var(--white);animation:spring .9s cubic-bezier(.34,1.7,.5,1) .2s both}
@keyframes spring{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.animal-name{position:relative;margin-top:.5rem;margin-bottom:.3em;font-size:clamp(4rem,20vw,8rem);color:var(--pink);animation:up .5s ease .5s both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tag{margin-top:.5rem;font-size:1.15rem;font-weight:700}
.ladder{margin-top:2rem;width:100%;padding:1.25rem}
.rungs{display:flex;align-items:flex-end;justify-content:space-between;gap:.25rem}
.rung{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;color:var(--card-muted);opacity:.6}
.rung.cur{color:var(--ink);opacity:1}
.rung span{font-family:var(--display);text-transform:uppercase;font-size:.68rem}
.rung.cur span{background:var(--ink);color:var(--white);border-radius:999px;padding:.1rem .5rem}
.track{position:relative;margin-top:.75rem;height:8px;border-radius:999px;background:rgba(23,29,58,.12)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--pink);transition:width 1s ease .6s;width:0}
.goal{margin-top:.75rem;text-align:right;font-family:var(--display);text-transform:uppercase}
.needs{margin-top:1.5rem;width:100%}
.needs h3,.duo h3{font-family:var(--display);text-transform:uppercase;font-weight:400;font-size:1.5rem}
.needs .list{margin-top:.75rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.duo{margin-top:1.5rem;width:100%;border:1px solid var(--line);border-radius:1.5rem;padding:1.25rem}
.gauge{margin-top:.75rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.gauge div{height:10px;border-radius:999px;background:rgba(255,255,255,.12)}
.gauge div.on{background:var(--peri)}
.duo p{margin-top:.6rem;font-weight:600;color:var(--muted);font-size:.92rem}

/* rdv / fin */
.rdv{max-width:48rem;margin:0 auto;padding:2.5rem 1.25rem;display:flex;flex-direction:column}
.rdv h2{text-align:center;font-size:clamp(2.2rem,8vw,4rem)}
.rdv iframe{display:block;width:100%;height:680px;border:0}
.end{max-width:36rem;margin:0 auto;padding:2.5rem 1.25rem;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end h2{margin-top:1.5rem;font-size:clamp(2.8rem,12vw,5.5rem)}
.end ul{list-style:none;margin-top:2rem;width:100%;display:flex;flex-direction:column;gap:.75rem;text-align:left}
.end li{display:flex;align-items:center;gap:.75rem;padding:1rem;font-weight:700}

@media (prefers-reduced-motion:reduce){.star,.pulse,.marquee span{animation:none!important}}
</style>
</head>
<body>
<div class="marquee" aria-hidden="true"><span>Stratégie ✺ Identité ✺ Contenus ✺ Social media ✺ Web ✺ Acquisition ✺ Automatisations IA ✺ Comme une agence, mais en mieux ! ✺ Stratégie ✺ Identité ✺ Contenus ✺ Social media ✺ Web ✺ Acquisition ✺ Automatisations IA ✺</span></div>
<main id="app"></main>

<script>
/* =========================================================
   DONNÉES — 11 questions fusionnées (7 de Nico + 4 nouvelles)
   points:1 = réponse « mature » (compte pour l'animal, sur 9)
   besoin   = drapeau métier remonté au collectif
   pret:1   = volet binôme humain + IA (ne compte pas pour l'animal)
   ========================================================= */
const QUESTIONS = [
  {sec:"Ta marque", q:"Ton logo et ta com'…", A:{label:"Me ressemblent à 100 %",points:1}, B:{label:"Datent un peu",besoin:"Identité"}},
  {sec:"Ta marque", q:"Ton univers…", A:{label:"Change selon l'humeur",besoin:"Direction artistique"}, B:{label:"A ses règles",points:1}},
  {sec:"Ta marque", q:"Tes contenus…", A:{label:"Te ressemblent",points:1}, B:{label:"Dépendent de qui s'en occupe",besoin:"Contenus & éditorial"}},
  {sec:"Ta visibilité", q:"Ton site…", A:{label:"Il dort… ou il n'existe pas",besoin:"Web"}, B:{label:"Il me ramène des clients",points:1}},
  {sec:"Ta visibilité", q:"Tes réseaux sociaux…", A:{label:"Je poste régulièrement",points:1}, B:{label:"Je poste quand j'y pense",besoin:"Social media"}},
  {sec:"Ta visibilité", q:"Tes nouveaux clients viennent…", A:{label:"Du bouche-à-oreille uniquement",besoin:"Acquisition"}, B:{label:"De Google et des réseaux",points:1}},
  {sec:"Ton organisation", q:"Ta semaine type…", A:{label:"Je fais mon métier",points:1}, B:{label:"Je me noie dans l'admin",besoin:"Automatisation"}},
  {sec:"Ton organisation", q:"Tes devis et factures, tu les relances…", A:{label:"À la main",besoin:"Automatisation"}, B:{label:"Ça part tout seul",points:1}},
  {sec:"Ton organisation", q:"L'IA dans ta boîte, c'est…", A:{label:"Un truc dont on parle",besoin:"Acculturation IA"}, B:{label:"Un outil du quotidien",points:1}},
  {sec:"Binôme humain + IA", bonus:true, q:"L'IA qui écrit tes mails ou tes posts…", A:{label:"Pas question"}, B:{label:"Ça me soulagerait",pret:1}},
  {sec:"Binôme humain + IA", bonus:true, q:"Ce qui n'est pas ton métier…", A:{label:"Je garde la main"}, B:{label:"Je le délègue",pret:1}},
];
const MAX = QUESTIONS.filter(q=>q.A.points||q.B.points).length; // 9

const ANIMALS = [
  {key:"DODO",   emoji:"🦤", tagline:"Ta marque dort encore. On la réveille ?"},
  {key:"TORTUE", emoji:"🐢", tagline:"Les bases sont là, ça avance doucement."},
  {key:"RENARD", emoji:"🦊", tagline:"Malin : de bons réflexes, quelques trous dans la raquette."},
  {key:"LOUP",   emoji:"🐺", tagline:"Une marque solide et des process qui tournent."},
  {key:"LION",   emoji:"🦁", tagline:"Marque, visibilité, organisation : tu règnes. Respect."},
];
function animalFor(s){ return s<=2?"DODO":s<=4?"TORTUE":s<=6?"RENARD":s<=8?"LOUP":"LION"; }

const BINOME = [
  {label:"Pas encore prêt", txt:"On commence par un audit et un peu d'acculturation : l'IA reste un outil, c'est l'expertise qui la cadre."},
  {label:"Curieux mais prudent", txt:"On te montre ce que l'IA peut prendre en charge, toujours pilotée par un expert senior du collectif."},
  {label:"Prêt à déléguer", txt:"On monte la team sur mesure : les bons experts du collectif, avec les bons outils IA."},
];

function compute(ans){
  let score=0, pret=0; const besoins=[];
  ans.forEach((a,i)=>{const o=QUESTIONS[i][a]; if(!o)return;
    if(o.points)score+=o.points; if(o.pret)pret+=o.pret;
    if(o.besoin&&!besoins.includes(o.besoin))besoins.push(o.besoin);});
  return {score, besoins, pret, animal:animalFor(score)};
}

/* Pictos animaux (tracés de la V1 de Nico) */
const PATHS={DODO:"M30 70 C30 45 45 35 60 38 C62 25 75 20 82 30 C90 32 92 40 84 44 L76 46 C80 60 78 78 60 84 C45 88 30 82 30 70 Z M45 84 L42 96 M62 85 L64 96 M76 30 L77 30",TORTUE:"M20 62 C22 38 40 26 58 26 C78 26 92 40 92 62 Z M20 62 L96 62 M40 30 L48 46 L66 46 L74 32 M48 46 L44 62 M66 46 L70 62 M92 50 C100 46 106 50 104 58 C102 62 96 62 92 60 M30 62 L28 76 M80 62 L82 76 M100 54 L101 54",RENARD:"M25 20 L40 50 M85 20 L70 50 M25 20 C35 22 45 35 55 38 C65 35 75 22 85 20 C85 45 75 65 55 78 C35 65 25 45 25 20 Z M45 50 L47 52 M63 50 L65 52 M55 70 L55 72",LOUP:"M28 18 L38 42 M82 18 L72 42 M28 18 L45 34 L65 34 L82 18 L78 55 L62 70 L55 82 L48 70 L32 55 Z M44 48 L48 50 M66 48 L62 50 M50 72 L60 72",LION:"M55 10 C70 10 78 18 88 22 C92 34 98 42 95 55 C98 68 88 78 82 88 C70 94 62 100 55 98 C48 100 40 94 28 88 C22 78 12 68 15 55 C12 42 18 34 22 22 C32 18 40 10 55 10 Z M35 50 C35 35 75 35 75 50 C75 68 66 78 55 78 C44 78 35 68 35 50 Z M46 52 L48 52 M62 52 L64 52 M50 64 L55 68 L60 64"};
const animalSvg=(k,size)=>`<svg viewBox="0 0 110 110" width="${size}" height="${size}" aria-hidden="true"><path d="${PATHS[k]}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const star=(cls,size)=>`<svg viewBox="0 0 40 40" class="star ${cls||''}" width="${size}" height="${size}" aria-hidden="true"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="20" y1="3" x2="20" y2="37"/><line x1="5" y1="11" x2="35" y2="29"/><line x1="5" y1="29" x2="35" y2="11"/></g></svg>`;
const ellipseSvg=(style,cls)=>`<svg viewBox="0 0 300 120" preserveAspectRatio="none" class="ellipse ${cls}" style="${style}" aria-hidden="true"><path d="M40 70 C 30 25, 230 5, 280 45 C 310 75, 200 115, 110 108 C 40 102, 5 80, 30 50 C 45 35, 90 25, 130 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const ellipse=(style)=>ellipseSvg(style,'back')+ellipseSvg(style,'front');

const app=document.getElementById('app');
let state={step:'cover', id:{prenom:'',nom:'',email:'',telephone:'',entreprise:'',site_url:''}, answers:[], rdv:false};
let timers=[];
const clearTimers=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]};
function go(step){

function cover(){

      <span class="pill">Comme une agence, mais en mieux !</span>

    <div style="margin-top:2rem">${star('',28)}</div>

  document.getElementById('start').onclick=()=>go('identity');

  // Ticker animaux + emoji synchronisé
  const tick=document.getElementById('tick'), emo=document.getElementById('emo');
  let i=0;
  const show=()=>{
    const a=ANIMALS[i], lion=a.key==='LION';
    tick.querySelectorAll('.word').forEach(w=>{w.className='word out';setTimeout(()=>w.remove(),350)});
    const w=document.createElement('span');w.className='word '+(lion?'lion':'in');w.textContent=a.key;
    if(lion){
      w.insertAdjacentHTML('beforeend',ellipse('left:-18%;top:-22%;width:136%;height:144%'));
      for(let k=0;k<8;k++){
        const s=document.createElement('span');s.className='spark';s.innerHTML=star('',24);
        const ang=k/8*Math.PI*2;
        s.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(ang)*150}px,${Math.sin(ang)*90}px) scale(1)`,opacity:0}],{duration:1100,delay:300,fill:'forwards',easing:'ease-out'});
        w.appendChild(s);
      }
    }
    tick.appendChild(w);
    emo.textContent=a.emoji;emo.classList.remove('pop');void emo.offsetWidth;emo.classList.add('pop');
    timers.push(setTimeout(()=>{i=(i+1)%ANIMALS.length;show()},lion?3200:1100));
  };
  show();

  // Pile de cartes qui défilent
  const stack=document.getElementById('stack');
  let n=0;
  const cardHtml=d=>`<p class="kicker">Question</p><p class="q">${esc(d.q)}</p><div class="opts"><span>${esc(d.a)}</span><span>${esc(d.b)}</span></div>`;
  const place=(el,pos)=>{el.style.zIndex=3-pos;el.style.transform=`translateY(${pos*12}px) scale(${1-pos*.05}) rotate(${pos===0?-2:pos*3}deg)`;el.style.opacity=1};
  let cards=[0,1,2].map(p=>{const el=document.createElement('div');el.className='card';el.innerHTML=cardHtml(DEMO[p]);place(el,p);stack.appendChild(el);return el});
  timers.push(setInterval(()=>{
    n++;const dir=n%2?1:-1;const top=cards.shift();
    top.style.transform=`translateX(${dir*320}px) rotate(${dir*25}deg)`;top.style.opacity=0;setTimeout(()=>top.remove(),500);
    cards.forEach((c,p)=>place(c,p));
    const el=document.createElement('div');el.className='card';el.innerHTML=cardHtml(DEMO[(n+2)%DEMO.length]);
    el.style.transform='translateY(24px) scale(.9)';el.style.opacity=0;stack.appendChild(el);cards.push(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>place(el,2)));
  },2400));
}

/* ---------- IDENTITÉ ---------- */
const FIELDS=[
  {k:'prenom',label:'Prénom',type:'text',ac:'given-name',v:v=>v.trim()?null:'Ton prénom ?'},
  {k:'nom',label:'Nom',type:'text',ac:'family-name',v:v=>v.trim()?null:'Ton nom ?'},
  {k:'email',label:'Email',type:'email',ac:'email',v:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())?null:'Email invalide'},
  {k:'telephone',label:'Téléphone',type:'tel',ac:'tel',v:v=>/^[+0-9 .()-]{6,30}$/.test(v.trim())?null:'Numéro invalide'},
  {k:'entreprise',label:'Entreprise',type:'text',ac:'organization',v:v=>v.trim()?null:'Le nom de ta boîte ?'},
  {k:'site_url',label:'URL du site (optionnel)',type:'url',ac:'url',ph:'www.monsite.fr',v:v=>!v.trim()||/^(https?:\/\/)?[\w-]+(\.[\w-]+)+/.test(v.trim())?null:'URL invalide'},
];
function identity(){
  app.innerHTML=`<section class="screen form-wrap">
    <h2>Présente-<span class="accent">toi</span></h2>
    <p style="margin-top:.5rem;font-weight:600;color:var(--muted)">Pour recevoir ton bilan perso par mail.</p>
    <form novalidate id="f" onsubmit="return false">
      ${FIELDS.map(f=>`<label class="f"><span class="l">${f.label}</span><input name="${f.k}" type="${f.type}" autocomplete="${f.ac}" ${f.ph?`placeholder="${f.ph}"`:''} value="${esc(state.id[f.k])}"><span class="err" data-e="${f.k}"></span></label>`).join('')}
      <label class="rgpd"><input type="checkbox" id="rgpd"><span>J'accepte d'être recontacté par le Collectif Sauvage et de recevoir mon bilan par email.</span></label>
      <span class="err" data-e="rgpd"></span>
      <button type="button" id="go" class="btn pink big" style="margin-top:1rem;width:100%">C'est parti</button>
    </form></section>`;
  const f=document.getElementById('f');
  const check=k=>{const def=FIELDS.find(x=>x.k===k);const inp=f.elements[k];const e=def.v(inp.value);
    inp.setAttribute('aria-invalid',!!e);f.querySelector(`[data-e="${k}"]`).textContent=e||'';return !e};
  FIELDS.forEach(d=>{const inp=f.elements[d.k];
    inp.addEventListener('input',()=>{state.id[d.k]=inp.value;if(inp.getAttribute('aria-invalid')==='true')check(d.k)});
    inp.addEventListener('blur',()=>check(d.k));});
  document.getElementById('rgpd').onchange=()=>f.querySelector('[data-e="rgpd"]').textContent='';
  const submit=()=>{let ok=FIELDS.map(d=>check(d.k)).every(Boolean);
    if(!document.getElementById('rgpd').checked){ok=false;f.querySelector('[data-e="rgpd"]').textContent='Coche la case pour continuer'}
    if(ok){state.answers=[];go('quiz')}
    else{const first=f.querySelector('[aria-invalid="true"]')||document.getElementById('rgpd');first.scrollIntoView({behavior:'smooth',block:'center'});}};
  document.getElementById('go').onclick=submit;
  f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();submit()}});
}

/* ---------- QUIZ (swipe) ---------- */
function quiz(){
  app.innerHTML=`<section class="screen quiz">
    <div class="progress"><div class="bar"><i id="bar"></i></div><div class="badge" id="badge"></div></div>
    <p class="badge-name" id="bname"></p>
    <div class="arena" id="arena"></div>
  </section>`;
  updateProgress();nextCard();
}
function updateProgress(){
  const r=compute(state.answers);
  document.getElementById('bar').style.width=(state.answers.length/QUESTIONS.length*100)+'%';
  const b=document.getElementById('badge');
  if(b.dataset.a!==r.animal){b.dataset.a=r.animal;b.innerHTML=animalSvg(r.animal,40);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
  document.getElementById('bname').textContent=r.animal;
}
let keyHandler=null;
function nextCard(){
  const idx=state.answers.length, Q=QUESTIONS[idx], arena=document.getElementById('arena');
  arena.innerHTML=`<div class="swipe card" id="sw">
      <p class="kicker">Question ${idx+1} / ${QUESTIONS.length}</p>
      <span class="sec ${Q.bonus?'bonus':''}">${Q.sec}</span>
      <p class="qq">${esc(Q.q)}</p>
      <div class="answers"><button type="button" data-c="A">← ${esc(Q.A.label)}</button><button type="button" data-c="B">${esc(Q.B.label)} →</button></div>
    </div>`;
  const card=document.getElementById('sw'), opts=card.querySelectorAll('.answers button');
  let x=0, startX=0, dragging=false, chosen=null;
  const setX=v=>{x=v;card.style.transform=`translateX(${x}px) rotate(${Math.max(-18,Math.min(18,x/200*18))}deg)`;
    const s=chosen||(x<-40?'A':x>40?'B':null);opts.forEach(o=>o.classList.toggle('on',o.dataset.c===s))};
  const choose=s=>{
    if(chosen)return;chosen=s;setX(x);card.style.cursor='default';
    const st=document.createElement('div');st.className='stamp';st.style.setProperty('--r',s==='A'?'-14deg':'14deg');st.textContent=Q[s].label;card.appendChild(st);
    setTimeout(()=>{
      const target=s==='A'?-600:600;
      card.animate([{transform:card.style.transform},{transform:`translateX(${target}px) rotate(${s==='A'?-18:18}deg)`}],{duration:350,easing:'ease-in',fill:'forwards'})
        .onfinish=()=>{state.answers.push(s);updateProgress();
          if(state.answers.length===QUESTIONS.length){document.removeEventListener('keydown',keyHandler);submitResults();go('result')}
          else nextCard();};
    },380);
  };
  card.addEventListener('pointerdown',e=>{if(chosen||e.target.closest('[data-c]'))return;dragging=true;startX=e.clientX-x;card.setPointerCapture(e.pointerId);card.style.transition='none'});
  card.addEventListener('pointermove',e=>{if(!dragging)return;const raw=e.clientX-startX;setX(raw*0.9)});
  const end=()=>{if(!dragging)return;dragging=false;
    if(x<-100)choose('A');else if(x>100)choose('B');
    else{card.style.transition='transform .35s cubic-bezier(.3,1.4,.5,1)';setX(0)}};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  arena.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(b.dataset.c));
  if(keyHandler)document.removeEventListener('keydown',keyHandler);
  keyHandler=e=>{if(e.key==='ArrowLeft')choose('A');if(e.key==='ArrowRight')choose('B')};
  document.addEventListener('keydown',keyHandler);
}

/* =========================================================
   ENVOI DES RÉSULTATS
   1. Web3Forms → mail récap à hello@collectifsauvage.fr (même clé que le formulaire contact du site)
   2. Apps Script → ligne dans le Sheet « Leads IA Masters » + bilan perso envoyé au prospect
      (coller l'URL /exec du déploiement Apps Script dans SHEET_URL ; vide = étape désactivée)
   ========================================================= */
const WEB3FORMS_KEY='a3566971-f219-485d-8ead-014052603c2f';
const SHEET_URL='';
const BILAN_AUTO=!!SHEET_URL;
function submitResults(){
  const r=compute(state.answers);
  const payload={...state.id, answers:state.answers, score:r.score, score_max:MAX, animal:r.animal, besoins:r.besoins, binome:BINOME[r.pret].label};
  state.payload=payload;
  const name=`${payload.prenom} ${payload.nom}`.trim();
  const detail=QUESTIONS.map((q,i)=>`${i+1}. ${q.q} → ${(q[state.answers[i]]||{}).label||'-'}`).join('\n');
  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:`🦁 Lead IA Masters — ${name} (${payload.entreprise}) : ${r.animal}`,from_name:'Test IA Masters',
      name,email:payload.email,replyto:payload.email,
      'Téléphone':payload.telephone,'Entreprise':payload.entreprise,'Site':payload.site_url||'-',
      'Animal':`${r.animal} (${r.score} / ${MAX})`,'Besoins détectés':r.besoins.join(', ')||'aucun','Binôme humain + IA':payload.binome,
      message:detail})}).then(x=>x.json()).then(j=>console.log('[Sauvage quiz] Web3Forms',j)).catch(e=>console.error('[Sauvage quiz] Web3Forms',e));
  if(SHEET_URL){
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .catch(e=>console.error('[Sauvage quiz] Sheet',e));
  }
}

/* ---------- RDV (Calendly de la V1) ---------- */
const CALENDLY='https://calendly.com/collectif-sauvage/rdv';
function rdv(){
  const name=`${state.id.prenom} ${state.id.nom}`.trim();
  const src=`${CALENDLY}?embed_type=Inline&hide_gdpr_banner=1&embed_domain=${location.host}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(state.id.email)}&utm_source=salon-ia-cci`;
  app.innerHTML=`<section class="screen rdv">
    <h2>On en discute avec le collectif, <span class="accent">on monte la team sur mesure.</span></h2>
    <div class="card" style="margin-top:1.5rem;overflow:hidden"><iframe title="Prendre RDV avec le Collectif Sauvage" src="${src}"></iframe></div>
    <button class="btn peri" style="margin:1.5rem auto 0" id="skip">Plus tard, envoie-moi juste mon bilan</button>
  </section>`;
  document.getElementById('skip').onclick=()=>go('end');
  const onMsg=e=>{if(typeof e.origin==='string'&&e.origin.includes('calendly.com')&&e.data&&e.data.event==='calendly.event_scheduled'){state.rdv=true;window.removeEventListener('message',onMsg);setTimeout(()=>go('end'),1500)}};
  window.addEventListener('message',onMsg);
}
